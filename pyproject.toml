[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "UQpy"
dynamic = ["version"]
description = "UQpy is a general purpose toolbox for Uncertainty Quantification"
readme = "README.rst"
requires-python = ">3.9.0"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Michael D. Shields" },
    { name = "Dimitris G. Giovanis" },
    { name = "Audrey Olivier" },
    { name = "Aakash Bangalore-Satish" },
    { name = "Mohit Chauhan" },
    { name = "Lohit Vandanapu" },
    { name = "Ketson R.M. dos Santos" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Natural Language :: English",
]
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.13.0",
    "matplotlib>=3.9.0",
    "scikit-learn>=1.5.0",
    "fire>=0.6.0",
    "beartype>=0.18.5",
    "torch >= 2.2.2",
    "torchinfo >= 1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest == 8.2.0",
    "pytest-cov == 5.0.0",
    "pylint >= 3.2.0",
    "pytest-azurepipelines == 1.0.5",
    "wheel == 0.43.0",
    "twine == 5.0.0",
    "sphinx_autodoc_typehints == 1.23.0",
    "sphinx_rtd_theme == 1.2.0",
    "sphinx_gallery == 0.13.0",
    "sphinxcontrib_bibtex == 2.5.0",
    "Sphinx==6.1.3",
    "hypothesis>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/SURGroup/UQpy"

[tool.setuptools]
platforms = ["OSX", "Windows", "Linux"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.pdf"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }
